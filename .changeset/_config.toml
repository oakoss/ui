#:schema ./_schema.json
tool-version = "0.5.0"
change-files = true
conventional-commits = true
versioning = "zero-major"
private-packages = { version = true, tag = true }
# The registry is the one release; each release deploys the docs site from
# its `v<version>` tag with that release's registry.
include = ["@oakoss/ui"]
tag-format = "v{{ version }}"
