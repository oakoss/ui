name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec shadcn registry validate

      - name: Check generated theme files are up to date
        run: |
          pnpm --filter @oakoss/tokens generate
          if [ -n "$(git status --porcelain -- packages/ui)" ]; then
            echo "Generated theme files are stale; run: pnpm --filter @oakoss/tokens generate"
            git status --short -- packages/ui
            git diff -- packages/ui
            exit 1
          fi

      - name: Check every package has a test script and lint configs
        run: |
          set -euo pipefail
          workspace="$(pnpm ls -r --depth -1 --json | jq -e '
            (map(.path) | min_by(length)) as $root
            | map(. + {dir: (.path | ltrimstr($root) | ltrimstr("/"))})
            | map(select(.dir != ""))
            | if length == 0 then error("pnpm found no workspace packages") else . end')"
          jq -e '
            [.[] | select(.name == null) | .dir]
            | if length > 0 then error("workspace packages without a name: \(join(" "))") else true end' <<<"$workspace" >/dev/null
          no_lint="$(jq -r '.[] | select(.dir | startswith("tooling/") | not) | .dir' <<<"$workspace" | while IFS= read -r dir; do
            [ -f "$dir/oxlint.config.ts" ] && [ -f "$dir/eslint.config.js" ] || echo "$dir"
          done)"
          if [ -n "$no_lint" ]; then
            echo "Missing oxlint.config.ts or eslint.config.js in: $no_lint"
            exit 1
          fi
          # Config-only tooling packages are covered by typecheck and lint.
          exempt="$(jq -c '[.[] | select(.dir | startswith("tooling/")) | .name]' <<<"$workspace")"
          missing="$(pnpm turbo run test --dry=json | jq -er --argjson exempt "$exempt" '
            (.packages | if length == 0 then error("turbo found no workspace packages") else . end)
            - $exempt
            - [.tasks[] | select(.task == "test" and (.command | type) == "string" and .command != "<NONEXISTENT>") | .package]
            | join(" ")')"
          if [ -n "$missing" ]; then
            echo "No test script in: $missing"
            exit 1
          fi

      # TEMP(ui-vqz): shows whether Vitest wrote the job summary. Remove once
      # the Flaky Tests section is confirmed.
      - run: |
          status=0
          pnpm test || status=$?
          echo "step summary: $(wc -c < "$GITHUB_STEP_SUMMARY") bytes"
          grep -c 'Flaky Tests' "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

  # A squash merge's message is built from the PR's commits and, when there
  # are several, its title; the commit-msg hook never sees it. Steps skip on
  # push so the job still reports success to the gate.
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Lint the PR's commits and title
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
          # Read the current title: a re-run reuses the event that started it.
          title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)"
          printf '%s\n' "$title" | pnpm exec commitlint --verbose

  # A changed @oakoss/ui needs a bump file. The version PR is the bump itself,
  # so its check skips unless a person triggered the run; steps skip on push so
  # the gate still sees success.
  oakum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Check release intent
        if: >-
          github.event_name == 'pull_request'
          && (github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot')
        run: pnpm exec oakum check --strict

      # Fork PRs get no secrets, so they skip the mint; a failed mint must not
      # fail the gate. Either way pr-status falls back to github.token.
      - name: Mint the oakoss App token
        id: app-token
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (success() || failure())
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post the release plan
        id: pr-status
        if: github.event_name == 'pull_request' && (success() || failure())
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: pnpm exec oakum ci pr-status

      # A step that failed must not read as one that reported.
      - if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the step failed, so the release plan may not have reached the PR or the job summary; the check above still decides"

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [check, commitlint, oakum]
    steps:
      # Gates every job in `needs`; a job left out of `needs` is not gated.
      - name: Gate on all required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # A gate that dies before its verdict must not read as a pass.
          verdict=
          trap 'rc=$?
            if [ -z "$verdict" ]; then
              verdict=aborted
              [ "$rc" -ne 0 ] || rc=1
              echo "::error title=CI gate::gate aborted (exit $rc) before reaching a verdict"
              exit "$rc"
            fi' EXIT INT TERM HUP

          summary=${GITHUB_STEP_SUMMARY:-/dev/null}
          results="$(mktemp)"

          expected=$(printf '%s' "$NEEDS" | jq -r 'if type == "object" then length else error("needs is not an object") end')
          case "$expected" in
            ''|*[!0-9]*)
              echo "::error title=CI gate::could not read the job count from needs"
              verdict=reached
              exit 1
              ;;
          esac
          if [ "$expected" -eq 0 ]; then
            echo "::error title=CI gate::needs is empty"
            verdict=reached
            exit 1
          fi

          printf '%s' "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' > "$results"

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$summary" ||
            echo "::warning title=CI gate::step summary unwritable; the verdict is unaffected"

          seen=0
          failed=0
          while IFS=$'\t' read -r job result; do
            seen=$((seen + 1))
            # shellcheck disable=SC2016 # the backticks are markdown, not a subshell
            printf '| %s | `%s` |\n' "$job" "$result" >> "$summary" || :
            if [ "$result" != "success" ]; then
              echo "::error title=CI gate::Job '${job:-<empty>}' did not succeed (result: $result)"
              failed=1
            fi
          done < "$results"

          if [ "$seen" -ne "$expected" ]; then
            echo "::error title=CI gate::read $seen of $expected jobs — results were truncated"
            verdict=reached
            exit 1
          fi

          verdict=reached
          exit "$failed"
