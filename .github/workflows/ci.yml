name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec shadcn registry validate

      - name: Check every package has a test script
        run: |
          set -euo pipefail
          pnpm ls -r --depth -1 --json | jq -e '
            [.[] | select(.name == null) | .path]
            | if length > 0 then error("workspace packages without a name: \(join(" "))") else true end' >/dev/null
          missing="$(pnpm turbo run test --dry=json | jq -er '
            (.packages | if length == 0 then error("turbo found no workspace packages") else . end)
            - [.tasks[] | select(.task == "test" and (.command | type) == "string" and .command != "<NONEXISTENT>") | .package]
            | join(" ")')"
          if [ -n "$missing" ]; then
            echo "No test script in: $missing"
            exit 1
          fi

      - run: pnpm test
