name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Bounds the turbo cache restored below, which every run re-saves.
    env:
      TURBO_CACHE_MAX_AGE: 7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      # Turbo replays a task whose inputs match an earlier run's, so packages
      # a change doesn't touch skip typecheck and tests. Turbo doesn't hash
      # the Node version or runner image, so the key does; the image variables
      # are the runner's own, which the env context can't read.
      - id: turbo-key
        run: |
          set -euo pipefail
          echo "prefix=turbo-${RUNNER_OS}-${ImageOS}-${ImageVersion}-$(node --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.turbo-key.outputs.prefix }}-check-${{ github.sha }}
          path: .turbo/cache
          restore-keys: ${{ steps.turbo-key.outputs.prefix }}-check-

      # The same checks as a local `pnpm check`, so the two can't drift.
      - run: pnpm check

      # A clean checkout stays clean: a generator that writes a file its
      # check doesn't know about fails here.
      - name: Check nothing was left changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Tree changed::pnpm check left files changed or added"
            git status --short
            git diff
            exit 1
          fi

      # The docs' pretest installs Chromium for this Playwright.
      - id: playwright
        run: |
          set -euo pipefail
          version="$(pnpm --filter @oakoss/storybook exec node -p "require('playwright/package.json').version")"
          [ -n "$version" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright

      # The storybook job runs Storybook's suite.
      - run: pnpm turbo run test --filter='!@oakoss/storybook'

  # Storybook's suite is CI's longest task, so it runs split across shards,
  # each on its own runner. The shard flag is part of turbo's task hash, so
  # each shard keeps its own cache.
  storybook:
    name: Storybook (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      TURBO_CACHE_MAX_AGE: 7d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - id: turbo-key
        run: |
          set -euo pipefail
          echo "prefix=turbo-${RUNNER_OS}-${ImageOS}-${ImageVersion}-$(node --version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.turbo-key.outputs.prefix }}-storybook-${{ matrix.shard }}-${{ github.sha }}
          path: .turbo/cache
          restore-keys: ${{ steps.turbo-key.outputs.prefix }}-storybook-${{ matrix.shard }}-

      # Storybook's pretest installs Chromium for this Playwright.
      - id: playwright
        run: |
          set -euo pipefail
          version="$(pnpm --filter @oakoss/storybook exec node -p "require('playwright/package.json').version")"
          [ -n "$version" ]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          path: ~/.cache/ms-playwright

      - run: pnpm turbo run test --filter=@oakoss/storybook -- --shard=${{ matrix.shard }}/2

  # A squash merge's message is built from the PR's commits and, when there
  # are several, its title; the commit-msg hook never sees it. Steps skip on
  # push so the job still reports success to the gate.
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Lint the PR's commits and title
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
          # Read the current title: a re-run reuses the event that started it.
          title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)"
          printf '%s\n' "$title" | pnpm exec commitlint --verbose

  # A changed @oakoss/ui needs a bump file. The version PR is the bump itself,
  # so its check skips unless a person triggered the run; steps skip on push so
  # the gate still sees success.
  oakum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - name: Check release intent
        if: >-
          github.event_name == 'pull_request'
          && (github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot')
        run: pnpm exec oakum check --strict

      # Fork PRs get no secrets, so they skip the mint; a failed mint must not
      # fail the gate. Either way pr-status falls back to github.token.
      - name: Mint the oakoss App token
        id: app-token
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && (success() || failure())
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post the release plan
        id: pr-status
        if: github.event_name == 'pull_request' && (success() || failure())
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: pnpm exec oakum ci pr-status

      # A step that failed must not read as one that reported.
      - if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the step failed, so the release plan may not have reached the PR or the job summary; the check above still decides"

  # jactionlint, a maintained actionlint fork that tracks new workflow syntax;
  # the default profile, security rules included.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # jactionlint skips `run:` blocks without shellcheck and still exits 0.
      - run: shellcheck --version

      # The action downloads the jactionlint release it was published with, so
      # pinning it pins the binary. No `shell: python` steps, so pyflakes is off.
      - uses: jdx/jactionlint@1027f0a131ab98bc7e191d995bfa15dbed5bbf8f # v2.2.0
        with:
          args: --pyflakes=

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [check, commitlint, oakum, storybook, workflows]
    steps:
      # Gates every job in `needs`; a job left out of `needs` is not gated.
      - name: Gate on all required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # A gate that dies before its verdict must not read as a pass.
          verdict=
          trap 'rc=$?
            if [ -z "$verdict" ]; then
              verdict=aborted
              [ "$rc" -ne 0 ] || rc=1
              echo "::error title=CI gate::gate aborted (exit $rc) before reaching a verdict"
              exit "$rc"
            fi' EXIT INT TERM HUP

          summary=${GITHUB_STEP_SUMMARY:-/dev/null}
          results="$(mktemp)"

          expected=$(printf '%s' "$NEEDS" | jq -r 'if type == "object" then length else error("needs is not an object") end')
          case "$expected" in
            ''|*[!0-9]*)
              echo "::error title=CI gate::could not read the job count from needs"
              verdict=reached
              exit 1
              ;;
          esac
          if [ "$expected" -eq 0 ]; then
            echo "::error title=CI gate::needs is empty"
            verdict=reached
            exit 1
          fi

          printf '%s' "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' > "$results"

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$summary" ||
            echo "::warning title=CI gate::step summary unwritable; the verdict is unaffected"

          seen=0
          failed=0
          while IFS=$'\t' read -r job result; do
            seen=$((seen + 1))
            # shellcheck disable=SC2016 # the backticks are markdown, not a subshell
            printf '| %s | `%s` |\n' "$job" "$result" >> "$summary" || :
            if [ "$result" != "success" ]; then
              echo "::error title=CI gate::Job '${job:-<empty>}' did not succeed (result: $result)"
              failed=1
            fi
          done < "$results"

          if [ "$seen" -ne "$expected" ]; then
            echo "::error title=CI gate::read $seen of $expected jobs — results were truncated"
            verdict=reached
            exit 1
          fi

          verdict=reached
          exit "$failed"
