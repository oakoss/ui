name: CI

on:
  push:
    branches: [main]
  pull_request:
  # On main, a manual run re-tests the docs and re-uploads main's preview.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  # A release-only PR can't change what the test suites and builds cover, and
  # its new version misses their turbo caches, so they skip; pnpm check still
  # lints the changelog and package.json. Pushes to main run everything.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release-only: ${{ steps.release.outputs.release-only }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: release
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/release-only

      - if: steps.release.outputs.release-only == 'true'
        run: echo "::notice title=Release-only diff::the test suites and builds skip; the PR changes only the changelog, the version and bump files"

  check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          turbo-cache: check

      # The same checks as a local `pnpm check`, so the two can't drift.
      - run: pnpm check

      # A clean checkout stays clean: a generator that writes a file its
      # check doesn't know about fails here.
      - name: Check nothing was left changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error title=Tree changed::pnpm check left files changed or added"
            git status --short
            git diff
            exit 1
          fi

      # The docs and storybook jobs run the browser suites.
      - if: needs.changes.outputs.release-only != 'true'
        run: pnpm turbo run test --filter='!@oakoss/docs' --filter='!@oakoss/storybook'

      # The suites run stories on Vite's dev server; the production build,
      # autodocs included, runs nowhere else.
      - if: needs.changes.outputs.release-only != 'true'
        run: pnpm turbo run build-storybook

  # The docs site's build, and its Playwright suite against the built site.
  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.release-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The hosted registry builds a directory per release tag.
          fetch-tags: true
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          playwright: '@oakoss/docs'
          turbo-cache: docs

      - run: pnpm turbo run test --filter=@oakoss/docs

      # The site these tests passed on, for preview-docs.
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: apps/docs/dist/client
          if-no-files-found: error
          retention-days: 7

  # Storybook's suite is CI's longest task, so it runs split across shards,
  # each on its own runner. The shard flag is part of turbo's task hash, so
  # each shard keeps its own cache.
  storybook:
    name: Storybook (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.release-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          playwright: '@oakoss/storybook'
          turbo-cache: storybook-${{ matrix.shard }}

      - run: pnpm turbo run test --filter=@oakoss/storybook -- --shard=${{ matrix.shard }}/2

  # A squash merge's message is built from the PR's commits and, when there
  # are several, its title; the commit-msg hook never sees it. Steps skip on
  # push so the job still reports success to the gate.
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup

      - name: Lint the PR's commits and title
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
          # Read the current title: a re-run reuses the event that started it.
          title="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .title)"
          printf '%s\n' "$title" | pnpm exec commitlint --verbose

  # A changed @oakoss/ui needs a bump file. The version PR is the bump itself,
  # so its check skips unless a person triggered the run; steps skip on push so
  # the gate still sees success.
  oakum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      emitted: ${{ steps.upload.outcome == 'success' }}
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup

      - name: Check release intent
        if: >-
          github.event_name == 'pull_request'
          && (github.head_ref != 'oakum/version-packages'
          || github.event.pull_request.head.repo.full_name != github.repository
          || github.event.pull_request.user.type != 'Bot'
          || github.event.sender.type != 'Bot')
        run: pnpm exec oakum check --strict

      # Writes the job summary and the plan comment, which oakum-comment posts.
      - name: Write the release plan
        id: pr-status
        if: github.event_name == 'pull_request' && (success() || failure())
        continue-on-error: true
        run: pnpm exec oakum ci pr-status --emit-comment "$RUNNER_TEMP/oakum-comment"

      - name: Upload the plan comment
        id: upload
        if: (success() || failure()) && steps.pr-status.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oakum-comment
          path: ${{ runner.temp }}/oakum-comment
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # A step that failed must not read as one that reported.
      - if: (success() || failure()) && steps.pr-status.outcome == 'failure'
        run: echo "::warning title=oakum ci pr-status::the release plan wasn't written, so the PR comment wasn't updated and the job summary may lack it; the check above still decides"

      - if: (success() || failure()) && steps.upload.outcome == 'failure'
        run: echo "::warning title=oakum comment::the plan comment didn't upload, so the PR comment wasn't updated; it's in this job's summary"

  # Posts oakum's plan comment from the oakoss App. Its own job, since a step
  # in a job that runs the PR's code can reach every later step there
  # (BASH_ENV through GITHUB_ENV); this one installs and runs the base
  # branch's oakum. The PR's emitted comment is data that post-comment checks.
  # It runs when the check fails too, since the comment explains a missing
  # bump file, and stays out of CI Summary's needs so a failed post never
  # blocks a merge. Fork PRs get no secrets, so they get the job summary alone.
  oakum-comment:
    needs: oakum
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.oakum.outputs.emitted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      # The PR's jobs run in this run's cache scope, so a store they saved
      # could put the PR's packages here.
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: 'false'

      # A lost artifact still reaches post-comment, which reports it as unverified.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: oakum-comment
          path: ${{ runner.temp }}/oakum-comment

      - name: Mint the oakoss App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Post the release plan
        id: comment
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm exec oakum ci post-comment "$RUNNER_TEMP/oakum-comment"

      - if: steps.app-token.outcome == 'failure' || steps.comment.outcome == 'failure'
        run: echo "::warning title=oakum comment::the release plan didn't reach the PR; it's in the oakum job's summary"

  # jactionlint, a maintained actionlint fork that tracks new workflow syntax;
  # the default profile, security rules included.
  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # jactionlint skips `run:` blocks without shellcheck and still exits 0.
      - run: shellcheck --version

      # The action downloads the jactionlint release it was published with, so
      # pinning it pins the binary. No `shell: python` steps, so pyflakes is off.
      - uses: jdx/jactionlint@baa8d685e2b27ff5821558c9eeabb2051c1da61b # v2.4.0
        with:
          args: --pyflakes=

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, check, commitlint, docs, oakum, storybook, workflows]
    steps:
      # Gates every job in `needs`; a job left out of `needs` is not gated.
      - name: Gate on all required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          # A gate that dies before its verdict must not read as a pass.
          verdict=
          trap 'rc=$?
            if [ -z "$verdict" ]; then
              verdict=aborted
              [ "$rc" -ne 0 ] || rc=1
              echo "::error title=CI gate::gate aborted (exit $rc) before reaching a verdict"
              exit "$rc"
            fi' EXIT INT TERM HUP

          summary=${GITHUB_STEP_SUMMARY:-/dev/null}
          results="$(mktemp)"

          expected=$(printf '%s' "$NEEDS" | jq -r 'if type == "object" then length else error("needs is not an object") end')
          case "$expected" in
            ''|*[!0-9]*)
              echo "::error title=CI gate::could not read the job count from needs"
              verdict=reached
              exit 1
              ;;
          esac
          if [ "$expected" -eq 0 ]; then
            echo "::error title=CI gate::needs is empty"
            verdict=reached
            exit 1
          fi

          printf '%s' "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result] | @tsv' > "$results"

          {
            echo "## CI Summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
          } >> "$summary" ||
            echo "::warning title=CI gate::step summary unwritable; the verdict is unaffected"

          seen=0
          failed=0
          while IFS=$'\t' read -r job result; do
            seen=$((seen + 1))
            # shellcheck disable=SC2016 # the backticks are markdown, not a subshell
            printf '| %s | `%s` |\n' "$job" "$result" >> "$summary" || :
            # A job skips by its own condition, or because a job it needs
            # failed, and that one is gated here too.
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error title=CI gate::Job '${job:-<empty>}' did not succeed (result: $result)"
                failed=1
                ;;
            esac
          done < "$results"

          if [ "$seen" -ne "$expected" ]; then
            echo "::error title=CI gate::read $seen of $expected jobs — results were truncated"
            verdict=reached
            exit 1
          fi

          verdict=reached
          exit "$failed"

  # Uploads the site the Docs job tested as main's preview, once the gate
  # passes; ui.oakoss.dev deploys from release tags. Only main's head
  # uploads, so a slow older run can't replace a newer preview.
  preview-docs:
    needs: ci-summary
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The default queue keeps one pending run, so a stale run could replace
    # the head's; max keeps every pending run.
    concurrency:
      group: docs-main-preview
      queue: max
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check this commit is main's head
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if ! [[ "$head" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Docs preview::couldn't read main's head (got '$head')"
            exit 1
          fi
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docs preview skipped::main has moved on to $head; that commit's CI run uploads once it passes"
          fi

      - if: steps.head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.head.outputs.current == 'true'
        uses: ./.github/actions/setup

      - if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: apps/docs/dist/client

      # wrangler exits 0 without a URL when previews are disabled, so read
      # the alias URL from its machine-readable output and fail if absent.
      - name: Upload main's preview
        if: steps.head.outputs.current == 'true'
        working-directory: apps/docs
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --preview-alias main
          url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" || true)"
          if [ -z "$url" ]; then
            echo "::error title=Docs preview::wrangler reported no preview alias URL"
            exit 1
          fi
          echo "Preview of main: $url" >> "$GITHUB_STEP_SUMMARY"
