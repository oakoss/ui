name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs get no secrets, so they cannot deploy a preview.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      preview-url: ${{ steps.preview.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          playwright: ${{ github.event_name == 'push' && '@oakoss/docs' || '' }}
          turbo-cache: docs-deploy

      # A PR that can't change the site gets no preview, since it would match
      # ui.oakoss.dev. Turbo doesn't see this workflow or the actions, so a
      # change to them still deploys one.
      - id: release
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/release-only
      - id: changes
        if: github.event_name == 'pull_request'
        env:
          RELEASE_ONLY: ${{ steps.release.outputs.release-only }}
          TURBO_SCM_BASE: HEAD^1
          TURBO_SCM_HEAD: HEAD
        run: |
          set -euo pipefail
          # Each value is assigned before it's tested, since set -e ignores a
          # command that fails inside a test.
          workflow_changes="$(git diff --name-only HEAD^1 HEAD -- .github/workflows/docs.yml .github/actions)"
          preview=true
          if [ "$RELEASE_ONLY" = true ]; then
            preview=false
            reason='the PR changes only the changelog, the version and bump files'
          elif [ -z "$workflow_changes" ]; then
            count="$(pnpm turbo ls --affected --filter=@oakoss/docs --output=json | jq -e '.packages.count | numbers')"
            if [ "$count" -eq 0 ]; then
              preview=false
              reason='nothing the docs site builds from changed'
            fi
          fi
          if [ "$preview" = false ]; then
            echo "::notice title=No docs preview::$reason"
          fi
          echo "preview=$preview" >> "$GITHUB_OUTPUT"

      # CI's docs job tests a PR. A deploy builds first, and its tests catch
      # pages that prerender with missing content.
      - if: github.event_name == 'push'
        run: pnpm turbo run test --filter=@oakoss/docs
      - if: steps.changes.outputs.preview == 'true'
        run: pnpm turbo run build --filter=@oakoss/docs

      - name: Deploy to ui.oakoss.dev
        if: github.event_name == 'push'
        working-directory: apps/docs
        run: pnpm exec wrangler deploy

      - name: Upload a preview version
        id: preview
        if: steps.changes.outputs.preview == 'true'
        working-directory: apps/docs
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        # wrangler exits 0 without a URL when previews are disabled, so read
        # the alias URL from its machine-readable output and fail if absent.
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --preview-alias "pr-$PR_NUMBER"
          url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          if [ -z "$url" ]; then
            echo "::error title=Docs preview::wrangler reported no preview alias URL"
            exit 1
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Posts the preview link as one comment from the oakoss App, like oakum's
  # release plan, updated on each push. Its own job, since a deploy step's
  # code can reach every later step in its job (BASH_ENV through GITHUB_ENV);
  # this one runs no code from the PR.
  preview-comment:
    needs: deploy
    if: github.event_name == 'pull_request' && needs.deploy.outputs.preview-url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A failed mint or comment must not fail the deploy that went up.
      - name: Mint the oakoss App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Comment the preview link
        id: comment
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.deploy.outputs.preview-url }}
          # The worker in apps/docs/wrangler.jsonc, on the account's workers.dev subdomain.
          PREVIEW_HOST: oakoss-ui-docs.jbabin91.workers.dev
        run: |
          set -euo pipefail
          # The deploy job ran the PR's code, so its output must be exactly
          # the alias it uploads.
          expected="https://pr-$PR_NUMBER-$PREVIEW_HOST"
          if [ "${PREVIEW_URL%/}" != "$expected" ]; then
            echo "::error title=Docs preview comment::the deploy job's preview URL isn't $expected"
            exit 1
          fi
          marker='<!-- docs-preview -->'
          body="$(printf '%s\nDocs preview: %s\n\nBuilt from %s.' "$marker" "$expected" "$HEAD_SHA")"
          id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" |
            jq -r --arg marker "$marker" 'add // [] | map(select(
              .performed_via_github_app.slug == "oakoss"
              and ((.body // "") | startswith($marker))
            )) | .[0].id // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

      - if: steps.app-token.outcome == 'failure' || steps.comment.outcome == 'failure'
        run: echo "::warning title=Docs preview comment::the link didn't reach the PR; it's in the deploy job's summary"
