name: Docs

# Pull request previews; CI's preview-docs uploads main's, and release-docs
# deploys ui.oakoss.dev from each release tag.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  # Builds the PR's site without the Cloudflare token, since the build runs
  # the PR's code and its dependencies.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs get no secrets, so they cannot deploy a preview.
    if: github.event.pull_request.head.repo.full_name == github.repository
    outputs:
      preview: ${{ steps.changes.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          # The hosted registry builds a directory per release tag.
          fetch-tags: true
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          # CI's Docs job saves this cache with its test results; a save here
          # would claim the key first and drop them.
          turbo-cache: docs
          turbo-cache-save: 'false'

      # A PR that can't change the site gets no preview, since it would match
      # ui.oakoss.dev. Turbo doesn't see this workflow or the actions, so a
      # change to them still deploys one.
      - id: release
        uses: ./.github/actions/release-only
      - id: changes
        env:
          RELEASE_ONLY: ${{ steps.release.outputs.release-only }}
          TURBO_SCM_BASE: HEAD^1
          TURBO_SCM_HEAD: HEAD
        run: |
          set -euo pipefail
          # Each value is assigned before it's tested, since set -e ignores a
          # command that fails inside a test.
          workflow_changes="$(git diff --name-only HEAD^1 HEAD -- .github/workflows/docs.yml .github/actions)"
          preview=true
          if [ "$RELEASE_ONLY" = true ]; then
            preview=false
            reason='the PR changes only the changelog, the version and bump files'
          elif [ -z "$workflow_changes" ]; then
            count="$(pnpm turbo ls --affected --filter=@oakoss/docs --output=json | jq -e '.packages.count | numbers')"
            if [ "$count" -eq 0 ]; then
              preview=false
              reason='nothing the docs site builds from changed'
            fi
          fi
          if [ "$preview" = false ]; then
            echo "::notice title=No docs preview::$reason"
          elif ! git diff --quiet HEAD^1 HEAD -- apps/docs/wrangler.jsonc; then
            echo "::warning title=Docs preview::the preview uploads with main's wrangler.jsonc, so this PR's changes to it aren't in it"
          fi
          echo "preview=$preview" >> "$GITHUB_OUTPUT"

      # CI's Docs job tests the PR; a preview only needs the build.
      - if: steps.changes.outputs.preview == 'true'
        run: pnpm turbo run build-registry --filter=@oakoss/docs

      - if: steps.changes.outputs.preview == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-preview
          path: apps/docs/dist/client
          if-no-files-found: error
          retention-days: 1

  # Uploads the built site with main's wrangler and config: it checks out the
  # PR's base, so the PR's packages and build scripts don't run beside the
  # token. A PR that edits this workflow still can.
  upload:
    needs: build
    if: needs.build.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      preview-url: ${{ steps.preview.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}

      # The PR's build job runs in this run's cache scope, so a store it saved
      # could put the PR's packages here.
      - uses: ./.github/actions/setup
        with:
          pnpm-cache: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-preview
          path: apps/docs/dist/client

      - name: Upload a preview version
        id: preview
        working-directory: apps/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        # wrangler exits 0 without a URL when previews are disabled, so read
        # the alias URL from its machine-readable output and fail if absent.
        run: |
          set -euo pipefail
          pnpm exec wrangler versions upload --preview-alias "pr-$PR_NUMBER"
          url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")"
          if [ -z "$url" ]; then
            echo "::error title=Docs preview::wrangler reported no preview alias URL"
            exit 1
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Posts the preview link as one comment from the oakoss App, like oakum's
  # release plan, updated on each push. Its own job, so the App token stays
  # out of the jobs that install packages.
  preview-comment:
    needs: upload
    if: needs.upload.outputs.preview-url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A failed mint or comment must not fail the deploy that went up.
      - name: Mint the oakoss App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Comment the preview link
        id: comment
        if: steps.app-token.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_URL: ${{ needs.upload.outputs.preview-url }}
          # The worker in apps/docs/wrangler.jsonc, on the account's workers.dev subdomain.
          PREVIEW_HOST: oakoss-ui-docs.jbabin91.workers.dev
        run: |
          set -euo pipefail
          # The link must be this PR's alias on the docs worker, whatever
          # wrangler reported.
          expected="https://pr-$PR_NUMBER-$PREVIEW_HOST"
          if [ "${PREVIEW_URL%/}" != "$expected" ]; then
            echo "::error title=Docs preview comment::the upload job's preview URL isn't $expected"
            exit 1
          fi
          marker='<!-- docs-preview -->'
          body="$(printf '%s\nDocs preview: %s\n\nBuilt from %s.' "$marker" "$expected" "$HEAD_SHA")"
          id="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" |
            jq -r --arg marker "$marker" 'add // [] | map(select(
              .performed_via_github_app.slug == "oakoss"
              and ((.body // "") | startswith($marker))
            )) | .[0].id // empty')"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

      - if: steps.app-token.outcome == 'failure' || steps.comment.outcome == 'failure'
        run: echo "::warning title=Docs preview comment::the link didn't reach the PR; it's in the upload job's summary"
