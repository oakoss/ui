name: Visual

# Screenshots every story and comments on the PR with the ones that changed
# since the nearest main capture. Report only: outside CI Summary and never a
# required check. Plan and measurements:
# docs/research/0005-visual-regression-spike.md.
on:
  # Only changes that can alter a screenshot capture, on main as on PRs. A PR
  # compares against the nearest main capture at or before its merge base.
  push:
    branches: [main]
    paths: &rendering
      - .github/workflows/visual.yml
      - apps/storybook/.storybook/**
      - apps/storybook/src/**
      - apps/storybook/vitest.config.ts
      - packages/tokens/src/**
      - '!packages/tokens/src/**/*.test.ts'
      - '!packages/tokens/src/__snapshots__/**'
      - packages/ui/src/**
      - '!packages/ui/src/**/*.test.ts'
      - pnpm-lock.yaml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: *rendering

permissions:
  contents: read

# Only PR runs cancel: a cancelled main capture makes later PRs compare against
# an older one.
concurrency:
  group: visual-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  capture:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # A ~16-minute capture plus up to 8 waiting for the base capture.
    timeout-minutes: 35
    # reg-actions finds the base run's artifact and comments on the PR.
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # Matches Storybook's pinned Playwright; bump the two together.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
    steps:
      # The PR head, not checkout's default merge commit, since the base is the
      # merge base's capture; reg-actions runs git merge-base, so full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # No store cache: pnpm/setup's saves one per run, which filled the
      # repo's cache budget, and a fresh install is small next to the capture.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          install: false

      # The image has no xz, which oakum's postinstall needs to unpack its
      # binary; capture needs no install script.
      - run: pnpm install --frozen-lockfile --ignore-scripts --no-runtime

      - name: Capture every story
        working-directory: apps/storybook
        env:
          CI: 'true'
          VITE_VISUAL: 'true'
        run: pnpm exec vitest run --update=all --reporter=default --reporter=github-actions --reporter=json --outputFile.json="$RUNNER_TEMP/visual.json"

      # A screenshot path without the project, or a capture that wrote nothing,
      # would otherwise pass.
      - name: Check each passed story wrote one image
        working-directory: apps/storybook
        shell: node {0}
        run: |
          const fs = require('node:fs');
          const path = require('node:path');
          const report = path.join(process.env.RUNNER_TEMP, 'visual.json');
          const passed = JSON.parse(fs.readFileSync(report, 'utf8')).numPassedTests;
          const written = fs
            .readdirSync('.visual', { recursive: true })
            .filter((file) => file.endsWith('.png')).length;
          console.log(`${passed} passed, ${written} images`);
          if (!Number.isInteger(passed) || passed === 0 || written !== passed) {
            console.log(`::error title=Visual capture::${written} images for ${passed} passed stories`);
            process.exit(1);
          }

      # The container runs as root over a runner-owned checkout, and checkout's
      # safe.directory entry doesn't outlast its step; reg-actions' git calls need it.
      - name: Trust the checkout for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # reg-actions looks for a capture at the merge base itself, which main
      # skips when that commit couldn't change rendering; this picks the
      # nearest earlier capture whose images haven't expired, waiting for one
      # still running, since an older base would report its changes as the PR's.
      - name: Find the base capture
        id: base
        if: github.event_name == 'pull_request'
        shell: node {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const repo = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}`;
          const api = async (path) => {
            const res = await fetch(`${repo}/${path}`, {
              headers: { accept: 'application/vnd.github+json', authorization: `Bearer ${process.env.GH_TOKEN}` },
            });
            if (!res.ok) throw new Error(`GET ${path}: HTTP ${res.status}`);
            return res.json();
          };
          // Exit 1 from cat-file means the commit isn't fetched (a main push
          // after checkout), so it can't be an ancestor; from --is-ancestor it
          // means not an ancestor. Anything else is git failing.
          const isAncestor = (sha, of) => {
            try {
              execFileSync('git', ['cat-file', '-e', sha], { stdio: 'ignore' });
            } catch (error) {
              if (error.status === 1) return false;
              throw error;
            }
            try {
              execFileSync('git', ['merge-base', '--is-ancestor', sha, of], { stdio: 'ignore' });
              return true;
            } catch (error) {
              if (error.status === 1) return false;
              throw error;
            }
          };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const deadline = Date.now() + 8 * 60 * 1000;
          (async () => {
            const mergeBase = execFileSync('git', ['merge-base', process.env.BASE_SHA, process.env.HEAD_SHA], { encoding: 'utf8' }).trim();
            // Every main run here is a commit that could change rendering, so a
            // skipped one means the chosen capture predates a rendering change.
            const skipped = [];
            for (let page = 1; page <= 10; page++) {
              const { workflow_runs: runs } = await api(`actions/workflows/visual.yml/runs?branch=main&event=push&per_page=100&page=${page}`);
              if (!Array.isArray(runs)) throw new Error('the Visual runs response has no workflow_runs');
              for (let run of runs) {
                if (!isAncestor(run.head_sha, mergeBase)) continue;
                while (run.status !== 'completed' && Date.now() < deadline) {
                  console.log(`Waiting for the capture of ${run.head_sha} (run ${run.id}, ${run.status}).`);
                  await sleep(30_000);
                  run = await api(`actions/runs/${run.id}`);
                }
                if (run.status !== 'completed') {
                  throw new Error(`the capture of ${run.head_sha} (run ${run.id}) is still ${run.status} after 8 minutes`);
                }
                const { artifacts } = await api(`actions/runs/${run.id}/artifacts?name=reg`);
                const images = run.conclusion === 'success' && artifacts.some((artifact) => !artifact.expired);
                if (!images) {
                  skipped.push(`${run.head_sha.slice(0, 7)} (run ${run.id}, ${run.conclusion === 'success' ? 'images expired' : run.conclusion})`);
                  continue;
                }
                console.log(`Merge base ${mergeBase}; comparing with ${run.head_sha} (run ${run.id}).`);
                if (skipped.length > 0) {
                  console.log(`::warning title=Visual base::comparing with ${run.head_sha.slice(0, 7)}, older than main's captures ${skipped.join(', ')}; their rendering changes will show as this PR's. Re-run those captures to restore the base.`);
                }
                fs.appendFileSync(process.env.GITHUB_OUTPUT, `target=${run.head_sha}\n`);
                return;
              }
              if (runs.length < 100) break;
            }
            console.log(`::warning title=Visual base::no main capture with images at or before ${mergeBase}${skipped.length > 0 ? `; skipped ${skipped.join(', ')}` : ''}`);
          })().catch((error) => {
            console.log(`::error title=Visual base::${error.message}`);
            process.exit(1);
          });

      # Uploads the capture as the `reg` artifact. On a PR it compares against
      # the base capture and comments only when images changed.
      - uses: reg-viz/reg-actions@f0cccbcab7e7ecf9b0434b719f1e842c97bcd2a7 # v3
        with:
          comment-mode: changes
          disable-branch: true
          github-token: ${{ github.token }}
          image-directory-path: apps/storybook/.visual
          outdated-comment-action: update
          target-hash: ${{ steps.base.outputs.target }}
          threshold-pixel: 50
