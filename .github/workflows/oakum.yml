name: oakum

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serializes overlapping pushes; each run re-derives what is pending.
concurrency:
  group: oakum
  cancel-in-progress: false

jobs:
  # Opens or updates the version PR after each merge, or when run by hand. The
  # oakoss App authors it, because a PR opened with GITHUB_TOKEN starts no CI
  # and could never pass the gate.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the oakoss App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm exec oakum ci version-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Tags the merged version and creates its GitHub release.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Mint the oakoss App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      # oakum release pushes the tag with the credentials checkout leaves.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup

      # Tags carry the App bot as their tagger, matching the token that pushes them.
      - name: Use the App bot's git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      # oakum prints `<package> <version> <tag>` for each release it completes,
      # a resumed one included, whose tag stays on an earlier commit than HEAD.
      # A re-run after the GitHub release exists prints none, so the tag on
      # HEAD stands in.
      - name: Release, and read its tag
        id: tag
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          pnpm exec oakum release | tee "$RUNNER_TEMP/oakum-release.txt"
          tags="$(awk '$1 == "@oakoss/ui" { print $3 }' "$RUNNER_TEMP/oakum-release.txt")"
          if [ -z "$tags" ]; then
            git fetch --quiet --tags origin
            tags="$(git tag --points-at HEAD --list 'v*')"
          fi
          if [ "$(printf '%s' "$tags" | grep -c .)" -gt 1 ]; then
            echo "::error title=Release::more than one @oakoss/ui release in one run: ${tags//$'\n'/ }"
            exit 1
          fi
          echo "tag=$tags" >> "$GITHUB_OUTPUT"

  # Deploys the release's docs and registry within this run, so a failure is
  # the merger's to see.
  docs:
    needs: release
    if: needs.release.outputs.tag != ''
    uses: ./.github/workflows/release-docs.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
