name: oakum

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serializes overlapping pushes; each run re-derives what is pending.
concurrency:
  group: oakum
  cancel-in-progress: false

jobs:
  # Opens or updates the version PR. The oakoss App authors it, because a PR
  # opened with GITHUB_TOKEN starts no CI and could never pass the gate.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the oakoss App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - run: pnpm exec oakum ci version-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # Tags the merged version and creates its GitHub release.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the oakoss App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      # Tags carry the App bot as their tagger, matching the token that pushes them.
      - name: Use the App bot's git identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id="$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"

      - run: pnpm exec oakum release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
