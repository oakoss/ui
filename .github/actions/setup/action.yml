name: Setup
description: Installs dependencies and restores the turbo and Chromium caches.

inputs:
  turbo-cache:
    description: A name for this job's turbo cache, or empty for none.
    default: ''
  turbo-cache-save:
    description: "'false' to restore the turbo cache without saving it, for a job that shares another job's cache."
    default: 'true'
  playwright:
    description: A package whose tests run Playwright, to restore Chromium for its version, or empty for none.
    default: ''
  pnpm-cache:
    description: "'false' to install without the pnpm store cache, which code from a PR earlier in the run could have written."
    default: 'true'

runs:
  using: composite
  steps:
    # pnpm/setup's own cache saves a ~290 MB store from every job under its
    # own key, which filled the repo's 10 GB cache budget and evicted the
    # turbo caches. One store per lockfile, saved from main, is restored here.
    - id: pnpm-store
      shell: bash
      run: |
        set -euo pipefail
        echo "PNPM_CONFIG_STORE_DIR=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_ENV"
        echo "path=$RUNNER_TEMP/pnpm-store" >> "$GITHUB_OUTPUT"
    - id: pnpm-cache
      if: inputs.pnpm-cache != 'false'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        path: ${{ steps.pnpm-store.outputs.path }}
        restore-keys: pnpm-store-${{ runner.os }}-${{ runner.arch }}-

    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        require-lockfile: true

    # A store restored from an older lockfile keeps its packages; pruning to
    # this install's keeps the saved store from growing with each change.
    - if: github.ref == 'refs/heads/main' && inputs.pnpm-cache != 'false' && steps.pnpm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm store prune
    - if: github.ref == 'refs/heads/main' && inputs.pnpm-cache != 'false' && steps.pnpm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
        path: ${{ steps.pnpm-store.outputs.path }}

    # Turbo replays a task whose inputs match an earlier run's, so packages
    # a change doesn't touch skip their tasks. Turbo doesn't hash the Node
    # version or runner image, so the key does; the image variables are the
    # runner's own, which the env context can't read. Every run re-saves the
    # cache, so the max age bounds it.
    - id: turbo-key
      if: inputs.turbo-cache != ''
      shell: bash
      run: |
        set -euo pipefail
        echo "prefix=turbo-${RUNNER_OS}-${ImageOS}-${ImageVersion}-$(node --version)" >> "$GITHUB_OUTPUT"
        echo "TURBO_CACHE_MAX_AGE=7d" >> "$GITHUB_ENV"
    - if: inputs.turbo-cache != '' && inputs.turbo-cache-save != 'false'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.turbo-key.outputs.prefix }}-${{ inputs.turbo-cache }}-${{ github.sha }}
        path: .turbo/cache
        restore-keys: ${{ steps.turbo-key.outputs.prefix }}-${{ inputs.turbo-cache }}-
    - if: inputs.turbo-cache != '' && inputs.turbo-cache-save == 'false'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.turbo-key.outputs.prefix }}-${{ inputs.turbo-cache }}-${{ github.sha }}
        path: .turbo/cache
        restore-keys: ${{ steps.turbo-key.outputs.prefix }}-${{ inputs.turbo-cache }}-

    # The package's pretest installs Chromium for its Playwright.
    - id: playwright
      if: inputs.playwright != ''
      shell: bash
      env:
        PACKAGE: ${{ inputs.playwright }}
      run: |
        set -euo pipefail
        version="$(pnpm --filter "$PACKAGE" exec playwright --version | sed -n 's/^Version //p')"
        [ -n "$version" ]
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - if: inputs.playwright != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
        path: ~/.cache/ms-playwright
