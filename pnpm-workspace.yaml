packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  # Exact: a new release changes the generated Catppuccin colors.
  '@catppuccin/palette': 1.8.0
  '@hugeicons/core-free-icons': ^4.3.5
  '@hugeicons/react': ^1.1.10
  # React Aria's own range, so the apps share its copy.
  '@internationalized/date': ^3.12.4
  '@phosphor-icons/react': ^2.1.10
  '@remixicon/react': ^4.9.0
  # Exact: 0.x and weeks old; its rules may change between minors.
  '@shadcn/lint': 0.2.5
  '@tabler/icons-react': ^3.48.0
  '@tanstack/charts': ^1.1.0
  '@tanstack/react-table': ^9.3.1
  '@types/culori': ^4.0.1
  '@types/node': ^26.6.4
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  cn: ^0.5.0
  culori: ^4.0.2
  embla-carousel-react: ^8.6.0
  eslint: ^10.12.0
  input-otp: ^1.5.0
  lucide-react: ^1.51.0
  oxlint: ^1.87.0
  react: ^19.3.0
  react-aria: ^3.53.1
  react-aria-components: ^1.22.1
  react-dom: ^19.3.0
  react-resizable-panels: ^4.14.7
  shadcn: ^4.21.1
  tailwind-variants: ^3.3.1
  tailwindcss: ^4.3.3
  tailwindcss-react-aria-components: ^2.2.0
  typescript: ^6.0.3
  vitest: ^5.0.4

allowBuilds:
  # Its postinstall downloads the release binary.
  '@oakoss/oakum': true
  esbuild: true
  lefthook: true
  unrs-resolver: false
  # Wrangler's local runtime; deploys don't need it.
  workerd: false

# markdownlint pins re2js exactly, below 2.8.7's lookbehind DoS fix; drop once
# its pin reaches 2.8.7.
overrides:
  markdownlint>re2js: 2.8.7

# Our own packages; the release-age window guards against third-party compromises.
minimumReleaseAgeExclude:
  - '@oakoss/*'
