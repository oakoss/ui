packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  '@hugeicons/core-free-icons': ^4.3.5
  '@hugeicons/react': ^1.1.10
  '@phosphor-icons/react': ^2.1.10
  '@remixicon/react': ^4.9.0
  # Exact: 0.x and weeks old; its rules may change between minors.
  '@shadcn/lint': 0.2.0
  '@tabler/icons-react': ^3.48.0
  '@types/culori': ^4.0.1
  '@types/node': ^26.6.3
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  cn: ^0.4.0
  culori: ^4.0.2
  eslint: ^10.11.0
  lucide-react: ^1.50.0
  oxlint: ^1.86.0
  react: ^19.3.0
  react-aria-components: ^1.21.1
  react-dom: ^19.3.0
  shadcn: ^4.21.0
  tailwind-variants: ^3.3.1
  tailwindcss: ^4.3.3
  tailwindcss-react-aria-components: ^2.2.0
  # Matches shadcn's own dependency, so SourceFile types line up.
  ts-morph: ^26.0.0
  typescript: ^6.0.3
  vitest: ^5.0.2

allowBuilds:
  esbuild: true
  lefthook: true
  unrs-resolver: false
  # Wrangler's local runtime; deploys don't need it.
  workerd: false
